<!DOCTYPE html>
<html lang="zn-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>校园公共信息与数据展示中心</title>
    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <style>
    .my-card-title {
     color: #0c49ba;
    }   
    </style>
</head>
<body>
    <div id="net-tip" class="alert alert-danger d-none">网络已断开，部分功能不可用</div>
    <header>
    <div class="container">
    <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
      <div class="container">
        <a class="navbar-brand" href="#school">校园公共信息与数据展示中心</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="sub.html">意见反馈</a>
          <a class="nav-link" href="campus.html">三维导航</a>
        </div>
      </div>
    </nav>
    <h2 class="text-center mb-4">校园介绍</h2>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title my-card-title">自习室开放数据展示</h5>
                    <p class="card-text">对学校各个地点的自习室进行统计处理</p>
                    <a href="room.html" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title my-card-title">图书馆数据展示</h5>
                    <p class="card-text">对图书借阅进行统计处理</p>
                    <a href="books.html" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title my-card-title">风景展示</h5>
                    <p class="card-text">展现学校的美丽风景</p>
                    <a href="view.html" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
        <h2 class="text-center mb-4">校园社团</h2>
        <div class="row g-3">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title my-card-title">社团风采展示</h5>
                    <p class="card-text">展示我校社团风采面貌</p>
                    <a href="bootstrap2.html" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
    </div>
</div>
 <footer class="text-center">
    <p class="mb-1">学校介绍</p></footer>
<script>
  var tip = document.getElementById('net-tip');
  window.addEventListener('offline', function () { 
    tip.classList.remove('d-none');
    });
  window.addEventListener('online', function () { 
    tip.classList.add('d-none'); 
    });
</script>
</body>
</html>
