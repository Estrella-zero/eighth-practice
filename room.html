<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学校自习室开放统计</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
  .chart-box { height: 360px; }
</style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">自习室数据看板</h1>
    <p class="text-muted" id="sub-title">数据来源：课程统一数据集</p>
  </header>

  <section class="mb-4">
    <h2 class="h5">自习室列表</h2>

    <div class="mb-3 d-flex align-items-center gap-3" > 
      <div>
        <label>楼层：</label>
        <select id= "filter-floor">
          <option value = "" >全部</option> 
          <option value = "1" >1楼</option>
          <option value = "2" >2楼</option>
          <option value = "3" >3楼</option>
          <option value = "4" >4楼</option> 
        </select> 
      </div>          
  <div id="status-filters"> 
    <button class="btn btn-outline-primary btn-sm" data-filter="all">全部</button>
    <button class="btn btn-outline-success btn-sm" data-filter="open">开放</button>
    <button class="btn btn-outline-danger btn-sm" data-filter="free">有空座</button>
    </div>
  </div>
    
    <ul id="room-list" class="list-group"></ul>
    </section>

  <section class="row g-3 mb-4" id="cards"></section>
  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各自习室座位剩余量（ECharts柱状图）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">自习室分布区占比（Echarts饼状图）</h2>
      <div class="chart-box" id="pie-chart"></div>
    </div>
    </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="rooms.js"></script>
</body>
</html>
